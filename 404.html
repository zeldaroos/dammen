<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Sidan hittades inte | Fiskdam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Mono', monospace;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(180deg, 
                #87CEEB 0%, 
                #4682B4 50%, 
                #2F4F7F 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }

        .error-container {
            max-width: 600px;
            padding: 40px 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        h1 {
            font-size: 120px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
            line-height: 1;
        }

        .fish-emoji {
            font-size: 80px;
            display: inline-block;
            animation: swim 2s ease-in-out infinite;
        }

        @keyframes swim {
            0%, 100% {
                transform: translateX(0px) rotate(0deg);
            }
            50% {
                transform: translateX(20px) rotate(5deg);
            }
        }

        h2 {
            font-size: 36px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        p {
            font-size: 20px;
            margin-bottom: 30px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            line-height: 1.6;
        }

        .home-button {
            display: inline-block;
            background: rgba(255, 255, 255, 0.9);
            color: #2F4F7F;
            padding: 15px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 22px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .home-button:hover {
            background: white;
            transform: scale(1.05);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.3);
        }

        .bubbles {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .bubble {
            position: absolute;
            bottom: -50px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            animation: rise 10s infinite ease-in;
        }

        @keyframes rise {
            to {
                bottom: 110%;
                transform: translateX(100px);
            }
        }

        .bubble:nth-child(1) {
            width: 40px;
            height: 40px;
            left: 10%;
            animation-duration: 8s;
            animation-delay: 0s;
        }

        .bubble:nth-child(2) {
            width: 20px;
            height: 20px;
            left: 20%;
            animation-duration: 6s;
            animation-delay: 1s;
        }

        .bubble:nth-child(3) {
            width: 50px;
            height: 50px;
            left: 35%;
            animation-duration: 9s;
            animation-delay: 2s;
        }

        .bubble:nth-child(4) {
            width: 30px;
            height: 30px;
            left: 50%;
            animation-duration: 7s;
            animation-delay: 0.5s;
        }

        .bubble:nth-child(5) {
            width: 25px;
            height: 25px;
            left: 65%;
            animation-duration: 8.5s;
            animation-delay: 1.5s;
        }

        .bubble:nth-child(6) {
            width: 35px;
            height: 35px;
            left: 80%;
            animation-duration: 7.5s;
            animation-delay: 0.8s;
        }

        .bubble:nth-child(7) {
            width: 45px;
            height: 45px;
            left: 90%;
            animation-duration: 9.5s;
            animation-delay: 2.5s;
        }
    </style>
</head>
<body>
    <div class="bubbles">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="error-container">
        <h1>404</h1>
        <div class="fish-emoji">🐠</div>
        <h2>Fisken simmade bort!</h2>
        <p>Sidan du letar efter finns inte i denna fiskdam.<br>
        Kanske har den simmat till djupare vatten?</p>
        <a href="/dammen" class="home-button">🏠 Tillbaka till fiskdammen</a>
    </div>
</body>
</html>
